name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_WORKERS: 3          # the page tests run in lanes; 3 suits a 4-core runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pyflakes playwright ruff
          python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check .

      - name: Full check list
        run: bash tests/run_checks.sh
