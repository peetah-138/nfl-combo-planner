name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_WORKERS: 3          # the page tests run in lanes; 3 suits a 4-core runner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # 3.10 matches Pythonista and the older Macs (run_checks.sh compiles both files with python3.10);
          # 3.12 is listed last so it stays the default python/python3.
          python-version: |
            3.10
            3.12

      - name: Check the Python versions
        run: |
          python --version
          python3.10 --version
          python --version | grep -q "Python 3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pyflakes playwright ruff==0.17.5
          python -m playwright install --with-deps chromium webkit   # webkit: test_hsw.py checks the iPhone haptic switches in Safari's engine

      - name: Lint (ruff)
        run: ruff check .

      - name: Full check list
        run: bash tests/run_checks.sh
